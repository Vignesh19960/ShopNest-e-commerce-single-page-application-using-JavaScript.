<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopNest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--Header -->
    <header>

        <h1>ShopNest</h1>

        <div class="cart-info">
             Cart:
            <span id="cartCount">0</span>
        </div>

    </header>


    <!-- Main Content -->
    <main>

        <!-- Search & Category -->
        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >

            <div class="category-buttons">

                <button
                    class="category-btn active"
                    data-category="All">
                    All
                </button>

                <button
                    class="category-btn"
                    data-category="Electronics">
                    Electronics
                </button>

                <button
                    class="category-btn"
                    data-category="Clothing">
                    Clothing
                </button>

                <button
                    class="category-btn"
                    data-category="Footwear">
                    Footwear
                </button>

                <button
                    class="category-btn"
                    data-category="Books">
                    Books
                </button>

            </div>

        </div>


        <!-- No Products Message -->
        <p id="noProducts" class="hidden">
            No products found.
        </p>


        <!-- Products -->
        <section id="productContainer">
        </section>


        <!-- Cart -->
        <section class="cart-section">

            <h2>Your Cart</h2>

            <div id="cartContainer">
            </div>

            <h3>
                Total:
                Rs.<span id="cartTotal">0</span>
            </h3>

        </section>

    </main>


   
    <script src="script.js"></script>

</body>

</html>
